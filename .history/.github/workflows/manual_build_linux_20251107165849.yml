name: 手动构建 Linux Wheel

on:
  # 仅手动触发
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python 版本'
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '1.'
      
      build_mode:
        description: '构建模式'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'

jobs:
  build:
    name: 构建 Linux Python ${{ github.event.inputs.python_version }} Wheel
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 签出代码
        uses: actions/checkout@v4
        with:
          # 自动拉取子模块（如果使用了 submodule）
          submodules: recursive
      
      - name: 🐍 设置 Python ${{ github.event.inputs.python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ github.event.inputs.python_version }}
      
      - name: 🦀 安装 Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: 📦 安装 maturin
        run: pip install maturin
      
      - name: 🔨 构建 wheel (${{ github.event.inputs.build_mode }})
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            maturin build --release --strip \
              --interpreter python${{ github.event.inputs.python_version }} \
              --manylinux 2014
          else
            maturin build \
              --interpreter python${{ github.event.inputs.python_version }} \
              --manylinux 2014
          fi
      
      - name: 📊 显示构建结果
        run: |
          echo "✅ 构建完成！"
          echo ""
          echo "📦 生成的 wheel 文件："
          ls -lh target/wheels/
          echo ""
          du -h target/wheels/*.whl
      
      - name: 📤 上传 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-python${{ github.event.inputs.python_version }}-${{ github.event.inputs.build_mode }}-wheel
          path: target/wheels/*.whl
          retention-days: 30
      
      - name: 💬 构建摘要
        run: |
          echo "### 🎉 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**配置信息:**" >> $GITHUB_STEP_SUMMARY
          echo "- Python 版本: ${{ github.event.inputs.python_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 构建模式: ${{ github.event.inputs.build_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- 平台: Linux (manylinux2014)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**下载方式:**" >> $GITHUB_STEP_SUMMARY
          echo "1. 点击上方 'Artifacts' 下载 wheel 文件" >> $GITHUB_STEP_SUMMARY
          echo "2. 在服务器上运行: \`pip install atomic_bomb_engine-*.whl\`" >> $GITHUB_STEP_SUMMARY
