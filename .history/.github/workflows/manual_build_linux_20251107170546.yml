name: 手动构建 Linux Wheel

on:
  # 仅手动触发
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python 版本'
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
      
      build_mode:
        description: '构建模式'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'

jobs:
  build:
    name: 构建 Linux Python ${{ github.event.inputs.python_version }} Wheel
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64
    
    steps:
      - name: 📥 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: 🦀 安装 Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: 📦 安装 maturin
        run: |
          # 将版本号转换为 cpXY 格式（例如 3.13 -> cp313）
          PY_VER=$(echo "${{ github.event.inputs.python_version }}" | sed 's/\.//')
          PYTHON_PATH="/opt/python/cp${PY_VER}-cp${PY_VER}/bin"
          ${PYTHON_PATH}/pip install maturin
      
      - name: 🔨 构建 wheel (${{ github.event.inputs.build_mode }})
        run: |
          source $HOME/.cargo/env
          PY_VER=$(echo "${{ github.event.inputs.python_version }}" | sed 's/\.//')
          PYTHON_PATH="/opt/python/cp${PY_VER}-cp${PY_VER}/bin"
          
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            ${PYTHON_PATH}/maturin build --release --strip \
              --interpreter ${PYTHON_PATH}/python
          else
            ${PYTHON_PATH}/maturin build \
              --interpreter ${PYTHON_PATH}/python
          fi
      
      - name: 📊 显示构建结果
        run: |
          echo "✅ 构建完成！"
          echo ""
          echo "📦 生成的 wheel 文件："
          ls -lh target/wheels/
          echo ""
          du -h target/wheels/*.whl
      
      - name: 📤 上传 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-python${{ github.event.inputs.python_version }}-${{ github.event.inputs.build_mode }}-wheel
          path: target/wheels/*.whl
          retention-days: 30
      
      - name: 💬 构建摘要
        run: |
          echo "### 🎉 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**配置信息:**" >> $GITHUB_STEP_SUMMARY
          echo "- Python 版本: ${{ github.event.inputs.python_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 构建模式: ${{ github.event.inputs.build_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- 平台: Linux (manylinux2014)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**下载方式:**" >> $GITHUB_STEP_SUMMARY
          echo "1. 点击上方 'Artifacts' 下载 wheel 文件" >> $GITHUB_STEP_SUMMARY
          echo "2. 在服务器上运行: \`pip install atomic_bomb_engine-*.whl\`" >> $GITHUB_STEP_SUMMARY
