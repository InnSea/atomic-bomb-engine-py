name: Build Linux Python 3.13 Wheel

on:
  # 手动触发
  workflow_dispatch:
  
  # 推送到指定分支时自动触发
  push:
    branches:
      - main
      - master
      - dev
  
  # 创建 tag 时触发
  push:
    tags:
      - 'v*'

jobs:
  build-linux-wheel:
    name: Build Linux Python 3.13 Wheel
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64
    
    steps:
      - name: 📥 签出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: 🦀 安装 Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: 📦 安装 maturin
        run: |
          /opt/python/cp313-cp313/bin/pip install maturin
      
      - name: 🔨 构建 wheel (manylinux2014)
        run: |
          source $HOME/.cargo/env
          /opt/python/cp313-cp313/bin/maturin build --release --strip \
            --interpreter /opt/python/cp313-cp313/bin/python
      
      - name: 📊 显示构建结果
        run: |
          echo "✅ 构建完成！"
          echo ""
          echo "📦 生成的 wheel 文件："
          ls -lh target/wheels/
          echo ""
          echo "文件详情："
          file target/wheels/*.whl
      
      - name: 📤 上传 wheel 作为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-python312-wheel
          path: target/wheels/*.whl
          retention-days: 30
      
      - name: 📝 生成构建信息
        run: |
          echo "## 构建信息" > build-info.txt
          echo "- 平台: Linux (manylinux2014)" >> build-info.txt
          echo "- Python 版本: 3.13" >> build-info.txt
          echo "- 构建时间: $(date)" >> build-info.txt
          echo "- Commit: ${{ github.sha }}" >> build-info.txt
          echo "- 分支: ${{ github.ref_name }}" >> build-info.txt
          cat build-info.txt
      
      - name: 📤 上传构建信息
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
          retention-days: 30

  # 可选：自动创建 Release（仅在打 tag 时）
  create-release:
    name: 创建 Release
    needs: build-linux-wheel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 下载 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-python312-wheel
          path: wheels
      
      - name: 📦 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: wheels/*.whl
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
