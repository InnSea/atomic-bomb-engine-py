name: Build and publish Python wheels for Linux

on:
  push:
    branches:
      - release
      - release-rc.*

jobs:
  build-wheels:
    name: Build wheels on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - name: 签出rust代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 签出前端
        uses: actions/checkout@v4
        with:
          repository: GiantAxeWhy/atomic-bomb-engine-front
          path: vue-project

      - name: 安装Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: 构建前端
        run: |
          cd vue-project  
          npm install
          npm run build

      - name: 删除原有dist
        run: rm -rf python/atomic_bomb_engine/dist/*

      - name: 复制dist到Python项目
        run: cp -r vue-project/dist/* python/atomic_bomb_engine/dist/

      - name: 设置python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装maturin
        run: python -m pip install "maturin>=1.4,<2"

      - name: 构建wheels
        run: python -m maturin build --release --locked --interpreter python${{ matrix.python-version }}

      - name: 验证 Python 3.14 wheel
        run: |
          python -m pip install --force-reinstall target/wheels/*-cp314-cp314-*.whl
          python -c "import atomic_bomb_engine as engine; engine.BatchRunner(); engine.WsBatchRunner()"

      - name: 上传wheels作为artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: target/wheels/*.whl
          if-no-files-found: error
